  <path d="M336 314 Q342 282 360 270" stroke="#AAAABC" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.65"/>
  <path d="M348 316 Q354 284 372 272" stroke="#AAAABC" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.65"/>
  <!-- Ears -->
  <ellipse cx="328" cy="347" rx="12" ry="15" fill="#B8743A"/>
  <ellipse cx="442" cy="347" rx="12" ry="15" fill="#B8743A"/>
