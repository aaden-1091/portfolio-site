  <rect x="140" y="390" width="236" height="160" rx="20" fill="#C4B499"/>
  <rect x="382" y="390" width="236" height="160" rx="20" fill="#C4B499"/>
  <rect x="140" y="534" width="236" height="132" rx="16" fill="#D4C4AA"/>
  <rect x="382" y="534" width="236" height="132" rx="16" fill="#D4C4AA"/>
