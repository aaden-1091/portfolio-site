  <path d="M635 484 Q632 472 635 460" stroke="#C8B0A0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M647 482 Q644 468 647 456" stroke="#C8B0A0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M659 484 Q656 472 659 460" stroke="#C8B0A0" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- COUCH -->
  <rect x="48" y="528" width="648" height="148" rx="32" fill="#C8B89A"/>
  <rect x="48" y="375" width="648" height="168" rx="32" fill="#B8A888"/>
  <!-- Armrests -->
  <rect x="48" y="395" width="82" height="250" rx="28" fill="#B8A888"/>
  <rect x="614" y="395" width="82" height="250" rx="28" fill="#B8A888"/>
