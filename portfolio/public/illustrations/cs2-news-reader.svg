  <circle cx="720" cy="718" r="142" fill="#E8DCCB" opacity="0.5"/>

  <!-- Floor -->
  <rect x="0" y="665" width="800" height="135" fill="#E8DDD0"/>
  <rect x="0" y="663" width="800" height="5" fill="#D4C5B0"/>

