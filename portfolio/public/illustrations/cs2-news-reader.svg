  <circle cx="357" cy="347" r="6.5" fill="#3A2010"/>
  <circle cx="411" cy="347" r="6.5" fill="#3A2010"/>
  <circle cx="359" cy="344" r="2" fill="white"/>
  <circle cx="413" cy="344" r="2" fill="white"/>
  <!-- Engaged expression -->
  <path d="M358 367 Q385 380 412 367" stroke="#3A2010" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <!-- Eyebrows raised (interested) -->
  <path d="M342 326 Q357 318 374 324" stroke="#5A4030" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M396 324 Q413 318 428 326" stroke="#5A4030" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Left arm relaxed on armrest -->
  <path d="M296 460 Q248 492 198 514" stroke="#C8844A" stroke-width="22" stroke-linecap="round"/>
  <circle cx="194" cy="516" r="15" fill="#C8844A"/>
  <!-- Right arm holding phone up -->
  <path d="M476 456 Q516 422 498 378" stroke="#C8844A" stroke-width="22" stroke-linecap="round"/>
  <circle cx="497" cy="373" r="15" fill="#C8844A"/>

  <!-- PHONE -->
  <rect x="460" y="262" width="78" height="132" rx="13" fill="#222222"/>
  <rect x="465" y="269" width="68" height="118" rx="9" fill="white"/>
  <!-- Camera notch -->
  <rect x="481" y="271" width="22" height="7" rx="3" fill="#111111" opacity="0.5"/>
  <!-- News app header -->
  <rect x="468" y="281" width="62" height="16" rx="4" fill="#D95A41"/>
  <rect x="472" y="284" width="38" height="9" rx="2" fill="white" opacity="0.9"/>
  <!-- Divider -->
  <rect x="468" y="300" width="62" height="1.5" fill="#E8E8E8"/>
  <!-- Headline 1 -->
  <rect x="471" y="305" width="55" height="7" rx="2" fill="#222222"/>
  <rect x="471" y="316" width="46" height="5" rx="2" fill="#A0A0A0"/>
  <rect x="471" y="325" width="40" height="5" rx="2" fill="#A0A0A0"/>
  <!-- News image -->
  <rect x="471" y="334" width="55" height="30" rx="3" fill="#4A90D9" opacity="0.18"/>
  <rect x="471" y="334" width="55" height="30" rx="3" stroke="#E0E0E0" stroke-width="1"/>
  <!-- Divider -->
  <rect x="468" y="368" width="62" height="1.5" fill="#E8E8E8"/>
  <!-- Headline 2 -->
  <rect x="471" y="373" width="52" height="7" rx="2" fill="#222222"/>
  <rect x="471" y="384" width="42" height="5" rx="2" fill="#A0A0A0"/>
  <!-- Home bar -->
  <rect x="481" y="376" width="30" height="4" rx="2" fill="#333333" opacity="0.35"/>

  <!-- Accent dots -->
  <circle cx="702" cy="98" r="14" fill="#D95A41" opacity="0.35"/>
  <circle cx="68" cy="662" r="12" fill="#8B6BA8" opacity="0.35"/>
  <circle cx="728" cy="382" r="9" fill="#F5C842" opacity="0.5"/>
</svg>
