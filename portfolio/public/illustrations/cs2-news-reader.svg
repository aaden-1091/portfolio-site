  <path d="M258 398 Q258 460 258 545" stroke="#B8A882" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.5"/>
  <path d="M500 398 Q500 460 500 545" stroke="#B8A882" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.5"/>

  <!-- PERSON seated -->
  <!-- Legs resting on floor -->
  <path d="M318 600 Q312 642 292 664" stroke="#5A3A1A" stroke-width="30" stroke-linecap="round"/>
  <path d="M436 600 Q452 642 482 664" stroke="#5A3A1A" stroke-width="30" stroke-linecap="round"/>
  <!-- Shoes -->
  <ellipse cx="287" cy="670" rx="28" ry="14" fill="#3A2010"/>
  <ellipse cx="488" cy="670" rx="28" ry="14" fill="#3A2010"/>
  <!-- Body -->
  <rect x="296" y="414" width="180" height="196" rx="52" fill="#8B6BA8"/>
  <!-- Neck -->
  <rect x="370" y="378" width="30" height="44" rx="10" fill="#C8844A"/>
  <!-- Head -->
  <ellipse cx="385" cy="345" rx="58" ry="60" fill="#C8844A"/>
