  <rect x="600" y="538" width="130" height="14" rx="6" fill="#B8956A"/>
  <rect x="654" y="552" width="22" height="118" rx="5" fill="#A07848"/>

  <!-- Coffee cup -->
  <rect x="618" y="486" width="52" height="54" rx="10" fill="white"/>
  <rect x="618" y="486" width="52" height="54" rx="10" stroke="#E0D0C0" stroke-width="3"/>
  <path d="M618 498 Q593 510 594 528 Q595 544 618 542" stroke="#D0C0B0" stroke-width="3" fill="none" stroke-linecap="round"/>
  <rect x="626" y="494" width="36" height="18" rx="6" fill="#8B5E3C" opacity="0.35"/>
