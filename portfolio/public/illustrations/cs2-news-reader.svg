  <rect x="340" y="336" width="34" height="21" rx="8" fill="none" stroke="#5A3A2A" stroke-width="4"/>
  <rect x="394" y="336" width="34" height="21" rx="8" fill="none" stroke="#5A3A2A" stroke-width="4"/>
  <line x1="374" y1="346" x2="394" y2="346" stroke="#5A3A2A" stroke-width="4"/>
  <line x1="328" y1="346" x2="340" y2="346" stroke="#5A3A2A" stroke-width="4"/>
  <line x1="428" y1="346" x2="442" y2="346" stroke="#5A3A2A" stroke-width="4"/>
