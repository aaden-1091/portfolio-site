  <circle cx="462" cy="358" r="7" fill="#F5C842"/>
  <line x1="568" y1="332" x2="568" y2="354" stroke="#F5C842" stroke-width="3"/>
  <circle cx="568" cy="358" r="7" fill="#F5C842"/>
