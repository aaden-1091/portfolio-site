  <!-- Legs -->
  <path d="M494 602 L485 716" stroke="#C8844A" stroke-width="30" stroke-linecap="round"/>
  <path d="M552 602 L562 716" stroke="#C8844A" stroke-width="30" stroke-linecap="round"/>
